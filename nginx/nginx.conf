# ---------------------------------------------------------------------------
# RetroGPT reverse proxy (development compose).
#
# Routes:
#   /       -> frontend  (Vite dev server, includes HMR websocket support)
#   /api/*  -> api-gateway (Node.js + Express)
#
# Mounted into the nginx container as /etc/nginx/conf.d/default.conf.
# ---------------------------------------------------------------------------

# Map for websocket upgrade handling (Vite HMR through the proxy).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend {
    server frontend:5173;
}

upstream api_gateway {
    server api-gateway:4000;
}

server {
    listen 80;
    server_name _;

    # Request body limit — the gateway enforces its own 1 MB limit too.
    client_max_body_size 1m;

    # Baseline security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # --- API ---------------------------------------------------------------
    # Server-Sent Events endpoint (Issue #25). Exact match so token frames
    # are flushed to the client as they arrive instead of being buffered.
    location = /api/chat/stream {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Frontend ----------------------------------------------------------
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
