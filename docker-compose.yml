version: '3.8'

services:
  # Vector database for embeddings and hybrid search
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: retrogpt-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - retrogpt-network

  # Redis for response caching and rate limiting
  redis:
    image: redis:7.2-alpine
    container_name: retrogpt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - retrogpt-network

  # MongoDB for chat session history
  mongo:
    image: mongo:7.0
    container_name: retrogpt-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=retrogpt
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - retrogpt-network

  # AI Service - Python FastAPI service for RAG
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: retrogpt-ai-service
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
      - ./data:/data
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-gemini}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-004}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-retro_games}
      - CHUNK_SIZE=${CHUNK_SIZE:-800}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-120}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-20}
      - RERANK_TOP_N=${RERANK_TOP_N:-5}
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - retrogpt-network

# Named volumes for data persistence
volumes:
  qdrant_data:
    name: retrogpt_qdrant_data
  redis_data:
    name: retrogpt_redis_data
  mongo_data:
    name: retrogpt_mongo_data

# Internal network for service communication
networks:
  retrogpt-network:
    name: retrogpt-network
    driver: bridge
