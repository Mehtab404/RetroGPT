services:
  # Vector database for embeddings and hybrid search
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: retrogpt-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      # qdrant's image has no curl/wget; probe the HTTP port with bash /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - retrogpt-network

  # Redis for response caching and rate limiting
  redis:
    image: redis:7.2-alpine
    container_name: retrogpt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - retrogpt-network

  # MongoDB for chat session history
  mongo:
    image: mongo:7.0
    container_name: retrogpt-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=retrogpt
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - retrogpt-network

  # AI Service - Python FastAPI service for RAG
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: retrogpt-ai-service
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
      - ./data:/data
      - ./eval:/eval
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-gemini}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-004}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-retro_games}
      - CHUNK_SIZE=${CHUNK_SIZE:-800}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-120}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-20}
      - RERANK_TOP_N=${RERANK_TOP_N:-5}
      - HYBRID_SEARCH_ENABLED=${HYBRID_SEARCH_ENABLED:-true}
      - HYBRID_PREFETCH_K=${HYBRID_PREFETCH_K:-20}
      - BM25_STATS_PATH=${BM25_STATS_PATH:-/data/bm25_stats.json}
      - RERANK_ENABLED=${RERANK_ENABLED:-true}
      - RERANK_MODEL=${RERANK_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}
      - RERANK_CACHE_DIR=${RERANK_CACHE_DIR:-/data/fastembed_cache}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - retrogpt-network

  # API Gateway - Node.js + TypeScript gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      target: development
    container_name: retrogpt-api-gateway
    ports:
      - "4000:4000"
    volumes:
      - ./api-gateway/src:/app/src
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=4000
      - CORS_ORIGIN=*
      - AI_SERVICE_URL=http://ai-service:8000
      - API_KEY=${API_KEY:-change-me}
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongo:27017/retrogpt
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-86400}
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-30}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - retrogpt-network

  # Frontend - React + Vite UI (dev server in compose)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: retrogpt-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    environment:
      - VITE_API_KEY=${API_KEY:-change-me}
      - VITE_PROXY_TARGET=http://api-gateway:4000
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - retrogpt-network

  # Nginx - reverse proxy: / -> frontend, /api -> api-gateway
  nginx:
    image: nginx:1.27-alpine
    container_name: retrogpt-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - retrogpt-network

# Named volumes for data persistence
volumes:
  qdrant_data:
    name: retrogpt_qdrant_data
  redis_data:
    name: retrogpt_redis_data
  mongo_data:
    name: retrogpt_mongo_data

# Internal network for service communication
networks:
  retrogpt-network:
    name: retrogpt-network
    driver: bridge
