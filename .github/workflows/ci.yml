name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-lint-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Lint with ruff
        run: ruff check .
      
      - name: Format check with black
        run: black --check .
      
      - name: Type check with mypy
        run: mypy app --ignore-missing-imports
        continue-on-error: true
      
      - name: Run tests with pytest
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./ai-service/coverage.xml
          flags: ai-service
          name: ai-service-coverage
        continue-on-error: true

  node-lint-test:
    name: Node Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api-gateway
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api-gateway/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint with ESLint
        run: npm run lint
      
      - name: Format check with Prettier
        run: npx prettier --check "src/**/*.ts"
      
      - name: Type check with TypeScript
        run: npx tsc --noEmit
      
      - name: Run tests with Jest
        run: npm test -- --coverage --ci
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./api-gateway/coverage/coverage-final.json
          flags: api-gateway
          name: api-gateway-coverage
        continue-on-error: true

  frontend-lint-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint with ESLint
        run: npm run lint
      
      - name: Format check with Prettier
        run: npx prettier --check "src/**/*.{ts,tsx,css}"
      
      - name: Type check with TypeScript
        run: npx tsc --noEmit
      
      - name: Run tests with Vitest
        run: npm test

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: false
          tags: retrogpt-ai-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          target: production
          push: false
          tags: retrogpt-api-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: false
          tags: retrogpt-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [python-lint-test, node-lint-test, frontend-lint-test, docker-build]
    if: always()
    
    steps:
      - name: Check if all jobs passed
        run: |
          if [[ "${{ needs.python-lint-test.result }}" != "success" ]] || \
             [[ "${{ needs.node-lint-test.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-lint-test.result }}" != "success" ]] || \
             [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All checks passed!"
